name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + lint sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Run test suite
        run: uv run pytest scripts/lint/tests/ scripts/tests/ -q

      - name: Build index from example data
        run: uv run python scripts/build_index.py

      - name: Run lint sweep
        run: uv run python scripts/lint/run_lint.py --all

      - name: Smoke-test analyze.py
        run: uv run python scripts/analyze.py >/dev/null
